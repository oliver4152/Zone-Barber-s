
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zone Barber's | Reservá tu turno</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101010;color:white;font-family:Arial,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:22px 7%;border-bottom:1px solid #333;gap:15px;flex-wrap:wrap}
header a{color:white;text-decoration:none;font-size:14px}
.logo{font-size:25px;font-weight:900;letter-spacing:2px}
.logo span{color:#e32636}
main{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:45px 20px}
.panel{width:100%;max-width:650px;text-align:center;background:#191919;border:1px solid #333;border-radius:12px;padding:45px 30px}
h1{font-size:34px;margin:12px 0}
h1 span{color:#e32636}
p{color:#aaa;line-height:1.6}
form{text-align:left;margin-top:30px}
label{display:block;margin:16px 0 7px;font-size:14px}
input,select{width:100%;padding:14px;background:#101010;color:white;border:1px solid #444;border-radius:6px;font-size:15px}
button{width:100%;padding:16px;margin-top:25px;background:#e32636;color:white;border:0;border-radius:6px;font-weight:bold;font-size:16px;cursor:pointer}
button:hover{background:#bd1d2a}
footer{text-align:center;padding:25px;color:#777;font-size:12px}
</style>
</head>
<body>
<header>
<a href="https://wa.me/543816642426">WhatsApp: 3816-642426</a>
<div class="logo">ZONE <span>BARBER'S</span></div>
<a href="https://www.google.com/maps/search/?api=1&query=Zone+Barbers+Catamarca">📍 Ubicación</a>
</header>

<main>
<section class="panel">
<div class="logo">ZONE <span>BARBER'S</span></div>
<h1>RESERVÁ TU <span>TURNO</span></h1>
<p>Elegí tu servicio, tu barbero y tu horario.</p>

<form id="booking">
<label>Nombre y apellido</label>
<input id="nombre" required placeholder="Tu nombre completo">

<label>WhatsApp</label>
<input id="whatsapp" required placeholder="Tu número de teléfono">

<label>Servicio</label>
<select id="servicio" required>
<option value="">Seleccioná un servicio</option>
<option>Corte - $10.000 - 25 min</option>
<option>Barba - $5.000 - 10 min</option>
<option>Cejas - $2.000 - 5 min</option>
<option>Corte + barba - $12.000 - 35 min</option>
<option>Corte + cejas - $11.000 - 33 min</option>
<option>Corte + barba y ceja - $13.000 - 38 min</option>
</select>

<label>Elegí tu barbero</label>
<select id="barbero" required>
<option value="">Seleccioná un barbero</option>
<option>Oliver</option>
<option>Barbero 2</option>
<option>Barbero 3</option>
<option>Barbero 4</option>
<option>Barbero 5</option>
</select>

<label>Fecha</label>
<input type="date" id="fecha" required>

<label>Horario</label>
<select id="hora" required>
<option value="">Seleccioná una fecha primero</option>
</select>

<button type="submit">RESERVAR AHORA</button>
</form>
<p id="mensaje"></p>
</section>
</main>

<footer>ZONE BARBER'S · CATAMARCA</footer>

<script>
const fecha=document.getElementById("fecha");
const hora=document.getElementById("hora");
fecha.min=new Date().toISOString().split("T")[0];

fecha.addEventListener("change",()=>{
hora.innerHTML='<option value="">Seleccioná un horario</option>';
const d=new Date(fecha.value+"T12:00:00");
if(d.getDay()===0){
hora.innerHTML='<option value="">Cerrado los domingos</option>';
return;
}
[[10,15],[18,22]].forEach(([inicio,fin])=>{
for(let m=inicio*60;m<fin*60;m+=5){
let h=String(Math.floor(m/60)).padStart(2,"0");
let min=String(m%60).padStart(2,"0");
hora.add(new Option(h+":"+min,h+":"+min));
}
}
);
});

document.getElementById("booking").addEventListener("submit",e=>{
e.preventDefault();
document.getElementById("mensaje").textContent=
"Esta página es una vista de prueba. Las reservas todavía no están conectadas.";
});
</script>
</body>
</html>
